name: Build NOVA AI Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP"
            mkdir -p build_src && unzip -q -o "$ZIP" -d build_src
          fi
          FILE=$(grep -rl --include=package.json '"nova-ai-desktop"' . --exclude-dir=node_modules --exclude-dir=.git | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::NOVA AI Desktop project not found. Upload the project ZIP to the repository ROOT (same level as the .github folder), then re-run."
            ls -la
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project directory: $DIR"
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: project
          path: ${{ env.DIR }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win
            glob: dist/*.exe
          - os: ubuntu-latest
            name: linux
            args: --linux
            glob: dist/*.AppImage
          - os: macos-latest
            name: mac
            args: --mac
            glob: dist/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Unit tests
        continue-on-error: true
        working-directory: app
        run: npm test

      - name: Build installer
        working-directory: app
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: List output
        working-directory: app
        shell: bash
        run: ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: nova-ai-desktop-${{ matrix.name }}
          path: app/${{ matrix.glob }}
          if-no-files-found: error
